[project]
name = "jeopardy2"
version = "0.1.0"
description = "Multi-provider AI agent harness (OpenAI primary, Claude fallback) served over FastAPI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "openai>=1.58",
    "anthropic>=0.42",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Observability is optional on purpose: without it installed the app runs
# exactly as before and `build_tracer` returns a NullTracer that says so.
obs = [
    "langfuse>=2",
]
# Retrieval is optional too: a fresh clone has no clue data to index, and the
# base image stays lean for `docker compose up`.
rag = [
    "chromadb>=0.5",
]
# The ADK multi-agent system (agents/). Gemini-based and entirely separate
# from the OpenAI/Claude harness in app/; nothing in app/ imports it.
adk = [
    "google-adk>=2.0",
    "google-genai>=1.0",
    "a2a-sdk>=0.2",
    "mcp>=2.0",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "agents"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
